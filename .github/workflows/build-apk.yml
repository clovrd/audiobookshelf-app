name: Build APK

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci --omit=optional

      - name: build Nuxt project
        run: npm run generate
        env:
          # Repository variable (Settings -> Secrets and variables -> Actions -> Variables), see KIDS.md
          KIDS_LOGO_BASE_URL: ${{ vars.KIDS_LOGO_BASE_URL }}

      - name: copy to Android project
        run: npx cap sync

      # Every runner has its own random debug key, and Android refuses updates signed with a different key.
      # The repository secret DEBUG_KEYSTORE_BASE64 holds the one shared key, android/app/build.gradle signs with it
      # through ABS_DEBUG_KEYSTORE (see KIDS.md "Updating the app").
      - name: restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set, this APK can't update an installed app"
          else
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "ABS_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: build Android app
        run: ./android/gradlew assembleDebug -p android --no-daemon

      - name: rename apk
        working-directory: android/app/build/outputs/apk/debug/
        run: |
          # Must match the key of the installed app (KIDS.md "Updating the app")
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner" verify --print-certs app-debug.apk | grep -m1 'SHA-256'
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          name="audiobookshelf-${build}.apk"
          mv -v app-debug.apk "${name}"

      - name: upload app
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/debug/*.apk
