server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The app shell is always revalidated (cheap 304s), so a redeploy lands on the next open.
    # A long max-age here would also shadow the service worker's network-first fetches.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Files that only change with a new vendor/font/icon version
    location ~ ^/(vendor|fonts|icons)/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
